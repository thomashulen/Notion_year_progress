<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      font-family: sans-serif;
      background: #1e1e1e;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }
    .circle-row {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }
    .circle {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 2px solid #fff;
    }
    .past {
      background-color: #fff;
    }
    .current {
      background-color: #888;
    }
    .future {
      background-color: #1e1e1e;
    }
    .percent, .week {
      font-family: monospace;
      font-size: 14px;
      color: #fff;
      margin-top: 4px;
      white-space: pre;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="circle-row" id="months"></div>
  <div class="percent" id="percent"></div>
  <div class="week" id="week"></div>

  <script>
    const today = new Date();
    const yearStart = new Date(today.getFullYear(), 0, 1);
    const yearEnd = new Date(today.getFullYear() + 1, 0, 1);
    const daysPassed = Math.floor((today - yearStart) / (1000 * 60 * 60 * 24));
    const totalDays = Math.floor((yearEnd - yearStart) / (1000 * 60 * 60 * 24));
    const percent = (daysPassed / totalDays * 100).toFixed(1);

    const month = today.getMonth(); // 0-indexed

    const container = document.getElementById("months");
    for (let i = 0; i < 12; i++) {
      const div = document.createElement("div");
      if (i < month) {
        div.className = "circle past";
      } else if (i === month) {
        div.className = "circle current";
      } else {
        div.className = "circle future";
      }
      container.appendChild(div);
    }

    document.getElementById("percent").textContent = `${daysPassed} / ${totalDays} days → ${percent}% of the year`;

    function getWeekNumber(d) {
      const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
      const dayNum = date.getUTCDay() || 7;
      date.setUTCDate(date.getUTCDate() + 4 - dayNum);
      const yearStart = new Date(Date.UTC(date.getUTCFullYear(), 0, 1));
      const weekNum = Math.ceil((((date - yearStart) / 86400000) + 1) / 7);
      return weekNum;
    }

    const weekNumber = getWeekNumber(today);
    document.getElementById("week").textContent = `It is Week ${weekNumber}`;
  </script>

</body>
</html>

</body>
</html>
