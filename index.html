<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      font-family: sans-serif;
      background: #2f3437;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .circle-row {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }
    .circle {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 2px solid #fff;
      background-color: #fff;
    }
    .past {
      background-color: #fff;
    }
    .current {
      background-color: #888;
    }
    .future {
      background-color: #2f3437;
    }
    .percent {
      font-size: 14px;
      color: #fff;
    }
  </style>
</head>
<body>

  <div class="circle-row" id="months"></div>
  <div class="percent" id="percent"></div>

  <script>
    const today = new Date();
    const yearStart = new Date(today.getFullYear(), 0, 1);
    const yearEnd = new Date(today.getFullYear() + 1, 0, 1);
    const daysPassed = Math.floor((today - yearStart) / (1000 * 60 * 60 * 24));
    const totalDays = Math.floor((yearEnd - yearStart) / (1000 * 60 * 60 * 24));
    const percent = (daysPassed / totalDays * 100).toFixed(1);

    const month = today.getMonth(); // 0-indexed

    const container = document.getElementById("months");
    for (let i = 0; i < 12; i++) {
      const div = document.createElement("div");
      if (i < month) {
        div.className = "circle past";
      } else if (i === month) {
        div.className = "circle current";
      } else {
        div.className = "circle future";
      }
      container.appendChild(div);
    }

    document.getElementById("percent").textContent = `${daysPassed} / ${totalDays} days → ${percent}% of the year`;
  </script>

</body>
</html>
